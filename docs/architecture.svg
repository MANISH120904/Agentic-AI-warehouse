<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="WarehouseVoiceAI architecture">
  <rect width="920" height="520" fill="#fafafa"/>
  <text x="24" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1c1917">WarehouseVoiceAI architecture</text>

  <!-- Phone -->
  <rect x="40" y="70" width="120" height="48" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="100" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1c1917">Phone</text>

  <!-- Arrow phone to edesy -->
  <line x1="160" y1="94" x2="220" y2="94" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edesy -->
  <rect x="230" y="58" width="200" height="72" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="330" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c1917">Edesy voice agent</text>
  <text x="330" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57534e">multimodal phone audio</text>

  <!-- Arrow edesy to fastapi via HTTP tools -->
  <path d="M430 94 H510 V210" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57534e">HTTP tools</text>

  <!-- ADK browser -->
  <rect x="40" y="190" width="170" height="56" rx="8" fill="#fff" stroke="#1c1917" stroke-width="2"/>
  <text x="125" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1917">ADK browser</text>
  <text x="125" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57534e">Gemini Live voice</text>

  <!-- Arrow ADK to FastAPI -->
  <line x1="210" y1="218" x2="300" y2="218" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FastAPI box -->
  <rect x="310" y="160" width="360" height="120" rx="10" fill="#ffffff" stroke="#1c1917" stroke-width="2.5"/>
  <text x="490" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1917">FastAPI local backend</text>
  <text x="490" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#44403c">tools  |  feedback loop  |  self-healing</text>
  <text x="490" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#44403c">low-latency metrics</text>

  <!-- Streamlit -->
  <rect x="40" y="330" width="170" height="48" rx="8" fill="#fff" stroke="#1c1917" stroke-width="2"/>
  <text x="125" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1917">Streamlit dashboard</text>

  <!-- Arrow streamlit to FastAPI -->
  <path d="M210 354 H260 V280 H310" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow FastAPI to SQLite -->
  <line x1="490" y1="280" x2="490" y2="360" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQLite -->
  <rect x="370" y="370" width="240" height="72" rx="10" fill="#ecfdf5" stroke="#166534" stroke-width="2"/>
  <text x="490" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">SQLite warehouse</text>
  <text x="490" y="422" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#166534">local .db file</text>

  <!-- Legend -->
  <text x="24" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57534e">Local data plane: FastAPI, ADK tools, and Streamlit all use the same SQLite database.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57534e"/>
    </marker>
  </defs>
</svg>
